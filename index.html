<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anotaciones</title>
<meta name="description" content="Anotaciones. Texto sobre una visual generativa.">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#201028}
#visual{position:fixed;inset:0;width:100%;height:100%;display:block}
.poema{position:fixed;inset:0;margin:0;color:white;font:clamp(18px,2.1vw,40px)/1.25 Arial,sans-serif;pointer-events:none}
.poema span{position:absolute;white-space:nowrap;text-shadow:0 1px 5px #20102855}
.poema span:nth-child(1){left:6%;top:7%}
.poema span:nth-child(2){right:12%;top:17%}
.poema span:nth-child(3){left:36%;top:29%}
.poema span:nth-child(4){left:55%;top:39%}
.poema span:nth-child(5){left:8%;top:48%}
.poema span:nth-child(6){right:7%;top:58%}
.poema span:nth-child(7){left:37%;top:65%}
.poema span:nth-child(8){left:13%;top:75%}
.poema span:nth-child(9){left:32%;top:85%}
.poema span:nth-child(10){right:8%;top:91%}
#estado{position:fixed;bottom:0;left:0;right:0;padding:12px;margin:0;background:#201028;color:white;font:14px/1.4 Arial}
@media(max-aspect-ratio:3/4){
.poema{font-size:clamp(16px,4.4vw,24px)}
.poema span:nth-child(1){left:7%;top:8%}
.poema span:nth-child(2){right:7%;top:18%}
.poema span:nth-child(3){left:24%;top:28%}
.poema span:nth-child(4){left:auto;right:10%;top:36%}
.poema span:nth-child(5){left:7%;top:46%}
.poema span:nth-child(6){right:8%;top:55%}
.poema span:nth-child(7){left:14%;top:63%}
.poema span:nth-child(8){left:32%;top:72%}
.poema span:nth-child(9){left:8%;top:81%}
.poema span:nth-child(10){right:10%;top:90%}
}
</style>
</head>
<body>
<canvas id="visual" aria-hidden="true"></canvas>
<p class="poema" aria-label="¿es muy infantil si deseo que algo me detenga a escapar de mi misma? no quiero ser este cliché de mujer que espera dejar de estar constantemente insaciable">
<span>¿es muy infantil si deseo</span>
<span>que algo me detenga</span>
<span>a escapar</span>
<span>de mi misma?</span>
<span>no quiero ser este cliché</span>
<span>de mujer</span>
<span>que espera</span>
<span>dejar de estar</span>
<span>constantemente</span>
<span>insaciable</span>
</p>
<p id="estado" hidden>No se pudo iniciar la animación. Probá abrir esta página en Chrome o Safari con WebGL habilitado.</p>
<script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
<script src="./main.js"></script>
</body>
</html>
