<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anotaciones</title>
<meta name="description" content="Anotaciones — abrir la visual original en Hydra.">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#201028;color:white;font:18px Arial,sans-serif}a{color:#ff69ce}
</style>
</head>
<body>
<p id="estado">Abriendo Anotaciones en Hydra…</p>
<script>
(async () => {
  const estado = document.getElementById('estado');
  try {
    const respuesta = await fetch('./anotaciones.js', { cache: 'no-store' });
    if (!respuesta.ok) throw new Error('No se pudo cargar el código');
    const codigo = await respuesta.text();
    const destino = 'https://hydra.ojack.xyz/?code=' + encodeURIComponent(btoa(encodeURIComponent(codigo)));
    const enlace = document.createElement('a');
    enlace.href = destino;
    enlace.textContent = 'Abrir Anotaciones en Hydra';
    estado.replaceChildren(enlace);
    window.location.replace(destino);
  } catch (error) {
    estado.textContent = 'No se pudo abrir la visual. Recargá la página para volver a intentar.';
  }
})();
</script>
</body>
</html>
